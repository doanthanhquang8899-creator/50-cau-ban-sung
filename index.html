: false}, {"id": 8, "set": 1, "number": 8, "level": "Thông hiểu", "text": "Trình tự nguyên lý hoạt động của súng AK ở thì lùi (sau khi viên đạn nổ) diễn ra như thế nào?", "options": ["Đạn chuyển động qua lỗ trích khí -> Khí thuốc đập vào mặt thoi đẩy -> Bệ khóa nòng & khóa nòng lùi -> Lò xo đẩy về bị ép -> Vỏ đạn bị hất ra ngoài.", "Bóp cò -> Búa đập vào kim hỏa -> Hạt lửa phát lửa -> Khí thuốc đẩy bệ khóa nòng lùi trực tiếp.", "Đạn nổ -> Lò xo đẩy về đẩy bệ khóa nòng lùi -> Thoi đẩy kéo khóa nòng mở khóa.", "Khí thuốc đẩy thẳng vào hộp tiếp đạn -> Đẩy viên đạn thứ hai lên buồng đạn."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 38", "topic": "CHUYÊN ĐỀ 1: TÍNH NĂNG, CẤU TẠO & NGUYÊN LÝ", "placeholder": false}, {"id": 9, "set": 1, "number": 9, "level": "Vận dụng sâu", "text": "Khi chiến sĩ đang bắn liên thanh súng AK, nếu nhả tay cò ra, tại sao súng dừng bắn ngay lập tức?", "options": ["Vì búa bị mắc lại ở bộ phận ngắt cò (hoặc lẫy giữ búa), không đập vào kim hỏa nữa dù bệ khóa nòng vẫn tiến về trước.", "Vì khóa nòng bị kẹt không thể lùi về sau được nữa.", "Vì lò xo đẩy về hết lực ép nên bệ khóa nòng dừng lại.", "Vì lỗ trích khí thuốc bị đóng kín tự động."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 38", "topic": "CHUYÊN ĐỀ 1: TÍNH NĂNG, CẤU TẠO & NGUYÊN LÝ", "placeholder": false}, {"id": 10, "set": 1, "number": 10, "level": "Vận dụng cao", "text": "Khối lượng súng AK khi không có đạn là 3.8 kg; khi lắp đủ 30 viên đạn là 4.3 kg. Đối với súng AKM cải tiến, các thông số tương ứng này giảm xuống còn bao nhiêu nhờ cải tiến vật liệu báng súng và vỏ súng?", "options": ["Không đạn: 3.1 kg; Lắp đủ 30 viên đạn: 3.6 kg.", "Không đạn: 3.3 kg; Lắp đủ 30 viên đạn: 3.8 kg.", "Không đạn: 2.9 kg; Lắp đủ 30 viên đạn: 3.4 kg.", "Không đạn: 3.5 kg; Lắp đủ 30 viên đạn: 4.0 kg."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 37", "topic": "CHUYÊN ĐỀ 1: TÍNH NĂNG, CẤU TẠO & NGUYÊN LÝ", "placeholder": false}, {"id": 11, "set": 2, "number": 11, "level": "Đúng / Sai", "text": "ĐÁNH GIÁ ĐÚNG/SAI VỀ NGUYÊN TẮC THÁO LẮP SÚNG AK:", "options": ["ĐÚNG", "SAI"], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39 - 40", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 12, "set": 2, "number": 12, "level": "Nhận biết", "text": "Bước thứ nhất trong quy trình tháo thông thường súng tiểu liên AK là động tác nào?", "options": ["Tháo hộp tiếp đạn, kiểm tra súng.", "Tháo ống đựng phụ tùng.", "Tháo thông nông.", "Tháo nắp hộp khóa nòng."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 13, "set": 2, "number": 13, "level": "Nhận biết", "text": "Thứ tự 7 bước tháo thông thường súng tiểu liên AK được sắp xếp đúng chuẩn là gì?", "options": ["1. Tháo hộp tiếp đạn, khám súng -> 2. Tháo ống phụ tùng -> 3. Tháo thông nông -> 4. Tháo nắp hộp khóa nòng -> 5. Tháo bộ phận đẩy về -> 6. Tháo bệ khóa nòng & khóa nòng -> 7. Tháo ống dẫn thoi & ốp lót tay trên.", "1. Tháo nắp hộp khóa nòng -> 2. Tháo hộp tiếp đạn -> 3. Tháo thông nông -> 4. Tháo phụ tùng -> 5. Tháo bệ khóa nòng -> 6. Tháo khóa nòng -> 7. Tháo bộ phận đẩy về.", "1. Tháo hộp tiếp đạn -> 2. Tháo thông nông -> 3. Tháo ống phụ tùng -> 4. Tháo bộ phận đẩy về -> 5. Tháo nắp hộp khóa nòng -> 6. Tháo bệ khóa nòng -> 7. Tháo ốp lót tay.", "1. Tháo thông nông -> 2. Tháo hộp tiếp đạn -> 3. Tháo nắp hộp khóa nòng -> 4. Tháo bệ khóa nòng -> 5. Tháo khóa nòng -> 6. Tháo bộ phận đẩy về -> 7. Tháo phụ tùng."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39 - 40", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 14, "set": 2, "number": 14, "level": "Thông hiểu", "text": "Khi thực hiện Bước 1 tháo súng (Tháo hộp tiếp đạn và kiểm tra súng), thao tác kiểm tra súng để bảo đảm an toàn bắt buộc phải thực hiện theo thứ tự nào?", "options": ["Mở khóa an toàn -> Kéo bệ khóa nòng hết cỡ về sau, quan sát buồng đạn -> Thả bệ khóa nòng về trước -> Bóp cò -> Đóng khóa an toàn.", "Bóp cò ngay -> Kéo bệ khóa nòng về sau -> Mở khóa an toàn -> Đóng khóa an toàn.", "Mở khóa an toàn -> Bóp cò -> Kéo bệ khóa nòng về sau -> Tháo hộp tiếp đạn.", "Kéo bệ khóa nòng về sau -> Bóp cò -> Mở khóa an toàn -> Đóng khóa an toàn."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 15, "set": 2, "number": 15, "level": "Thông hiểu", "text": "Trong thao tác tháo khóa nòng ra khỏi bệ khóa nòng (ở Bước 6 tháo súng), chiến sĩ phải thực hiện động tác xoay khóa nòng như thế nào?", "options": ["Tay trái nắm ngửa bệ khóa nòng, tay phải xoay khóa nòng sang phải về phía sau cho mấu đóng mở rời khỏi rãnh lượn rồi rút ra.", "Kéo thẳng khóa nòng về phía sau mà không cần xoay.", "Xoay khóa nòng sang trái một góc 180 độ rồi nhấc lên.", "Nhấn chốt khóa nòng xuống rồi đẩy về phía trước."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 40", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 16, "set": 2, "number": 16, "level": "Nhận biết", "text": "Bước thứ tư trong quy trình LẮP súng tiểu liên AK là gì?", "options": ["Lắp nắp hộp khóa nòng, kiểm tra chuyển động của súng.", "Lắp bộ phận đẩy về.", "Lắp bệ khóa nòng và khóa nòng.", "Lắp thông nông."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 41", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 17, "set": 2, "number": 17, "level": "Thông hiểu", "text": "Sau khi LẮP xong nắp hộp khóa nòng (Bước 4 lắp súng), hành động kiểm tra chuyển động súng gồm những thao tác bắt buộc nào?", "options": ["Kéo bệ khóa nòng về sau hết cỡ rồi thả ra tự do 2-3 lần -> Bóp cò (thấy búa đập mạnh) -> Gạt cần định cách bắn và khóa an toàn về vị trí an toàn.", "Bóp cò ngay -> Gạt khóa an toàn -> Lắp hộp tiếp đạn.", "Kéo bệ khóa nòng về sau và giữ nguyên -> Gạt cần định cách bắn -> Giữ cò.", "Tháo ra lắp lại từ đầu để kiểm tra."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 41", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 18, "set": 2, "number": 18, "level": "Vận dụng sâu", "text": "Trong quá trình thực hành tháo súng AK, học sinh gặp tình huống bệ khóa nòng bị kẹt không kéo lùi về sau được. Nguyên nhân chính và cách xử lý đúng kỹ thuật là gì?", "options": ["Do chưa tháo nắp hộp khóa nòng hoặc cần khóa an toàn chưa gạt xuống vị trí bắn; xử lý bằng cách kiểm tra gạt cần khóa an toàn về vị trí bắn.", "Do khóa nòng bị hỏng; xử lý bằng cách dùng búa gõ mạnh vào tay kéo bệ khóa nòng.", "Do thông nông chưa tháo; xử lý bằng cách rút thông nông ra trước.", "Do lò xo đẩy về bị gãy; xử lý bằng cách tháo báng súng."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39 - 45", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 19, "set": 2, "number": 19, "level": "Vận dụng sâu", "text": "Yêu cầu về môi trường và quy tắc an toàn khi thực hành tháo, lắp súng tiểu liên AK được quy định như thế nào?", "options": ["Chọn nơi khô ráo, sạch sẻ; dùng đúng phụ tùng; thao tác nhẹ nhàng, đúng thứ tự; trước khi tháo bắt buộc phải kiểm tra, khám súng.", "Có thể tháo lắp trên nền đất ướt mà không cần dùng bạt.", "Khi gặp vướng mắc được dùng búa hoặc tô-vít bẩy mạnh để tháo nhanh.", "Tháo các bộ phận xếp chồng lên nhau để tiết kiệm diện tích bàn tháo."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 20, "set": 2, "number": 20, "level": "Vận dụng cao", "text": "Trong thi đấu hội thao tháo lắp súng AK nhanh, tiêu chí đánh giá thành tích và xử lý vi phạm quy tắc an toàn được áp dụng như thế nào?", "options": ["Tính tổng thời gian hoàn thành; nếu vi phạm quy tắc an toàn (như không khám súng, bóp cò khi súng đang chĩa vào người khác) sẽ bị trừ điểm nặng hoặc hủy kết quả.", "Chỉ tính thời gian, không quan tâm đến quy tắc khám súng.", "Ai tháo xong trước là thắng, không cần lắp lại.", "Không bắt buộc phải kiểm tra chuyển động súng sau khi lắp."], "answer": 0, "source": "SGK GDQP&AN 11, Bài 6, Trang 39 - 41", "topic": "CHUYÊN ĐỀ 2: QUY TẮC THÁO, LẮP SÚNG AK", "placeholder": false}, {"id": 21, "set": 3, "number": 21, "level": "Đúng / Sai", "text": "ĐÁNH GIÁ ĐÚNG/SAI VỀ ĐƯỜNG NGẮM CƠ BẢN:", "options": ["ĐÚNG", "SAI"], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6: Kĩ thuật bắn súng tiểu liên AK, Trang 47", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 22, "set": 3, "number": 22, "level": "Nhận biết", "text": "Đường ngắm đúng được định nghĩa chính xác trong lý thuyết bắn súng AK là gì?", "options": ["Là đường ngắm cơ bản được dóng vào điểm ngắm đã xác định với điều kiện mặt súng phải thăng bằng.", "Là đường thẳng nối từ mắt người ngắm trực tiếp đến tâm mục tiêu.", "Là đường thẳng đi qua khe ngắm và mép dưới mục tiêu.", "Là đường song song với trục nòng súng đi qua đỉnh đầu ngắm."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 47", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 23, "set": 3, "number": 23, "level": "Thông hiểu", "text": "Hiện tượng xảy ra đối với điểm chạm trên mục tiêu khi người bắn mắc lỗi 'Đầu ngắm cao hơn so với mép trên khe ngắm' (đường ngắm cơ bản sai)?", "options": ["Điểm chạm trên mục tiêu sẽ cao hơn so với điểm định bắn trúng.", "Điểm chạm trên mục tiêu sẽ thấp hơn so với điểm định bắn trúng.", "Điểm chạm sẽ lệch sang bên trái mục tiêu.", "Điểm chạm không thay đổi vì điểm ngắm đúng."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 48", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 24, "set": 3, "number": 24, "level": "Thông hiểu", "text": "Khi người bắn lấy đường ngắm cơ bản đúng, điểm ngắm đúng, nhưng 'Mặt súng bị nghiêng về bên trái', kết quả đạn trúng mục tiêu sẽ bị lệch như thế nào?", "options": ["Điểm chạm sẽ lệch về bên trái và THẤP XUỐNG.", "Điểm chạm sẽ lệch về bên trái và CAO LÊN.", "Điểm chạm sẽ lệch về bên phải và THẤP XUỐNG.", "Điểm chạm chỉ lệch sang trái, chiều cao không đổi."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 49", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 25, "set": 3, "number": 25, "level": "Thông hiểu", "text": "Quy luật chung về ảnh hưởng của nghiêng mặt súng đến quỹ đạo đường đạn là gì?", "options": ["Mặt súng nghiêng về bên nào thì điểm chạm sẽ lệch về bên đó và THẤP XUỐNG.", "Mặt súng nghiêng về bên nào thì điểm chạm lệch về bên đối diện.", "Mặt súng nghiêng về bên nào thì điểm chạm sẽ CAO LÊN về bên đó.", "Mặt súng nghiêng không ảnh hưởng đến độ cao điểm chạm."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 49", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 26, "set": 3, "number": 26, "level": "Thông hiểu", "text": "Hiện tượng điểm chạm sẽ vừa thấp vừa lệch phải xảy ra khi người bắn mắc tổ hợp lỗi ngắm sai nào?", "options": ["Đầu ngắm thấp hơn mép trên khe ngắm VÀ lệch sang phải.", "Đầu ngắm cao hơn mép trên khe ngắm VÀ lệch sang phải.", "Đầu ngắm thấp hơn mép trên khe ngắm VÀ lệch sang trái.", "Mặt súng nghiêng sang trái VÀ đầu ngắm cao."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 48", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 27, "set": 3, "number": 27, "level": "Vận dụng sâu", "text": "Tại sao trong 3 yếu tố ngắm bắn (thước ngắm đúng, điểm ngắm đúng, đường ngắm cơ bản đúng), việc giữ đường ngắm cơ bản đúng lại có ý nghĩa quyết định nhất đến độ chụm của đạn?", "options": ["Vì sai lệch đường ngắm cơ bản gây ra sai lệch góc bắn, làm điểm chạm trên mục tiêu cự li xa bị chênh lệch rất lớn theo tỷ lệ góc.", "Vì thước ngắm đã được cố định sẵn trên súng nên không bao giờ sai.", "Vì điểm ngắm trên mục tiêu có thể thay đổi tùy ý trong khi bắn.", "Vì đường ngắm cơ bản quyết định tốc độ đạn bay ra khỏi nòng."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 48", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 28, "set": 3, "number": 28, "level": "Vận dụng sâu", "text": "Một học sinh khi thực hành bắn tập thấy 3 phát đạn đều ăn sang bên trái mục tiêu khoảng 15 cm. Giáo viên kiểm tra thấy đường ngắm cơ bản của học sinh rất chuẩn. Nguyên nhân sâu xa và cách khắc phục là gì?", "options": ["Do học sinh chọn điểm ngắm bị lệch sang trái hoặc mặt súng nghiêng trái; khắc phục bằng cách chỉnh lại điểm ngắm sang phải hoặc giữ mặt súng thăng bằng.", "Do học sinh bóp cò quá mạnh làm súng nảy sang phải.", "Do lực vai ghi súng quá chặt.", "Do đạn bị ẩm làm giảm tốc độ."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 48 - 49", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 29, "set": 3, "number": 29, "level": "Vận dụng cao", "text": "Phân tích nguyên lý vật lý lý giải tại sao nghiêng mặt súng lại khiến điểm chạm bị tụt thấp xuống so với điểm định bắn?", "options": ["Vì khi mặt súng nghiêng, lực nâng của góc bắn bị giảm (do lực nâng vuông góc bị phân tích thành 2 thành phần), đồng thời trọng lực kéo đường đạn xuống làm điểm chạm vừa lệch vừa thấp.", "Vì khi mặt súng nghiêng, đạn thoát ra khỏi nòng bị xoáy ngược chiều.", "Vì khí thuốc trích ra bị lệch hướng làm giảm tốc độ đạn.", "Vì áp má vào báng súng bị trượt làm đầu người hạ thấp."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 49", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 30, "set": 3, "number": 30, "level": "Nhận biết", "text": "Điểm ngắm đúng được định nghĩa là gì?", "options": ["Là điểm được xác định trước, sao cho khi ngắm vào đó để bắn thì quỹ đạo của đường đạn đi qua điểm định bắn trúng trên mục tiêu.", "Là chính giữa tâm màu đen của mục tiêu bia.", "Là mép trên của đầu ngắm trùng với khe ngắm.", "Là giao điểm của đường ngắm cơ bản và mặt phẳng bắn."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 47", "topic": "CHUYÊN ĐỀ 3: LÝ THUYẾT NGẮM BẮN & ẢNH HƯỞNG NGẮM SAI", "placeholder": false}, {"id": 31, "set": 4, "number": 31, "level": "Đúng / Sai", "text": "ĐÁNH GIÁ ĐÚNG/SAI VỀ YẾU LĨNH GIƯƠNG SÚNG:", "options": ["ĐÚNG", "SAI"], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 51", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 32, "set": 4, "number": 32, "level": "Nhận biết", "text": "Trong bài học GDQP&AN cấp THPT, học sinh được học và thực hành động tác bắn tại chỗ nào của súng tiểu liên AK?", "options": ["Động tác nằm bắn có bệ tỳ.", "Động tác đứng bắn không có bệ tỳ.", "Động tác quỳ bắn có bệ tỳ.", "Cả 3 tư thế: Đứng, Quỳ, Nằm bắn."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 49", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 33, "set": 4, "number": 33, "level": "Nhận biết", "text": "Khẩu lệnh thực hiện động tác chuẩn bị bắn trong nằm bắn có bệ tỳ là gì?", "options": ["\"Nằm chuẩn bị bắn\".", "\"Bắt đầu bắn\".", "\"Chuẩn bị tư thế bắn\".", "\"Mục tiêu bia số 4 - BẮN\"."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 50", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 34, "set": 4, "number": 34, "level": "Thông hiểu", "text": "Trong cử động 3 của tư thế nằm chuẩn bị bắn, thân người người bắn hợp với hướng bắn một góc khoảng bao nhiêu độ?", "options": ["Khoảng 30 độ.", "Khoảng 45 độ.", "Khoảng 60 độ.", "Thẳng hàng 0 độ."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 50", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 35, "set": 4, "number": 35, "level": "Thông hiểu", "text": "Giải thích ý nghĩa của yếu tố \"ĐỀU\" trong yêu cầu giương súng AK (\"Bằng, Chắc, Đều, Bền\")?", "options": ["\"Đều\" là lực giữ hai tay và lực ghi súng vào vai phải đều nhau trong suốt quá trình thực hiện phát bắn, loạt bắn.", "\"Đều\" là nhịp thở ra hít vào đều đặn khi đang bóp cò.", "\"Đều\" là khoảng cách từ mắt đến khe ngắm không thay đổi.", "\"Đều\" là thời gian giữa các lần bắn bằng nhau."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 51", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 36, "set": 4, "number": 36, "level": "Thông hiểu", "text": "Kỹ thuật áp má vào báng súng khi ngắm bắn súng AK yêu cầu người bắn thực hiện như thế nào để tránh làm súng nghiêng hoặc rung động?", "options": ["Áp má phải vào báng súng với lực vừa phải; không gối má lên báng súng làm mặt súng bị nghiêng.", "Tựa đè toàn bộ trọng lượng đầu lên báng súng để giữ súng chắc chắn.", "Không được áp má vào báng súng để tránh bị nảy chấn thương.", "Giữ má cách báng súng 2 cm để dễ quan sát."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 51", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 37, "set": 4, "number": 37, "level": "Thông hiểu", "text": "Kỹ thuật hô hấp (thở) và động tác bóp cò được kết hợp chuẩn xác như thế nào ngay trước thời điểm đạn nổ?", "options": ["Trước khi bóp cò kết thúc phát bắn phải ngưng thở (sau khi thở ra hoặc hít vào sâu) để giữ người và súng ổn định.", "Vừa bóp cò vừa hít vào thật sâu.", "Vừa bóp cò vừa thở mạnh ra.", "Thở bình thường không cần ngừng thở."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 52", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 38, "set": 4, "number": 38, "level": "Vận dụng sâu", "text": "Trong quá trình đang bóp cò, nếu phát hiện đường ngắm bị sai lệch (do mỏi hoặc giật mình), người bắn phải xử trí như thế nào theo đúng quy tắc kỹ thuật?", "options": ["Ngừng bóp cò, ngón trỏ giữ nguyên áp lực trên tay cò, chỉnh lại đường ngắm đúng rồi tiếp tục tăng cò kết thúc phát bắn.", "Nhả hoàn toàn ngón tay cò ra khỏi vòng cò rồi thực hiện lại từ đầu.", "Giật giật ngón tay cò thật nhanh để đạn nổ ngay.", "Nhắm mắt lại bóp dứt khoát."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 52", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 39, "set": 4, "number": 39, "level": "Vận dụng sâu", "text": "Thao tác đặt ngón tay vào tay cò súng AK yêu cầu vị trí tiếp xúc nào trên ngón tay trỏ để lực kéo dồn thẳng về sau?", "options": ["Dùng phần cuối đốt thứ nhất, đầu đốt thứ hai của ngón tay trỏ phải để bóp cò; mặt trong ngón trỏ không sát vào tay cầm.", "Dùng khớp nối giữa đốt thứ hai và đốt thứ ba bóp cò.", "Dùng đầu ngón tay trỏ (mặt móng tay) bóp cò.", "Đặt cả hai ngón tay vào vòng cò để tăng lực bóp."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 52", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 40, "set": 4, "number": 40, "level": "Vận dụng cao", "text": "Khi bắn bài thi đạn thật súng AK, hiện tượng 'giật cò' (chớp thời cơ bóp cò nhanh, đột ngột) gây ra tác hại gì trực tiếp đến đường đạn?", "options": ["Làm nòng súng bị dìm xuống hoặc hếch lên đột ngột tại thời điểm kim hỏa đập, gây sai lệch nghiêm trọng đường đạn dù trước đó ngắm đúng.", "Làm đạn bị lép không nổ được.", "Làm kẹt đạn trong buồng đạn.", "Làm súng bị vỡ nắp hộp khóa nòng."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 52", "topic": "CHUYÊN ĐỀ 4: YẾU LĨNH ĐỘNG TÁC NẰM BẮN AK", "placeholder": false}, {"id": 41, "set": 5, "number": 41, "level": "Đúng / Sai", "text": "ĐÁNH GIÁ ĐÚNG/SAI VỀ ĐIỀU KIỆN BÀI BẮN BIA SỐ 4:", "options": ["ĐÚNG", "SAI"], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 58", "topic": "CHUYÊN ĐỀ 5: NGẮM CHỤM, NGẮM TRÚNG & BÀI BẮN BIA 4", "placeholder": false}, {"id": 42, "set": 5, "number": 42, "level": "Nhận biết", "text": "Trong tập ngắm chụm, ngắm trúng bia đồng tiền, khoảng cách đặt bảng ngắm đến bệ bắn và đường kính bia đồng tiền được quy định là bao nhiêu?", "options": ["Cách bệ bắn 10 m; đường kính bia đồng tiền 5 cm, vòng tròn đen 2 cm.", "Cách bệ bắn 15 m; đường kính bia đồng tiền 10 cm, vòng tròn đen 5 cm.", "Cách bệ bắn 5 m; đường kính bia đồng tiền 3 cm, vòng tròn đen 1 cm.", "Cách bệ bắn 100 m; đường kính bia đồng tiền 20 cm."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 54", "topic": "CHUYÊN ĐỀ 5: NGẮM CHỤM, NGẮM TRÚNG & BÀI BẮN BIA 4", "placeholder": false}, {"id": 43, "set": 5, "number": 43, "level": "Nhận biết", "text": "Tiêu chuẩn đánh giá kết quả kiểm tra ĐỘ CHỤM trong tập ngắm chụm 3 lần ngắm được xếp loại GIỎI khi nào?", "options": ["Khi 3 điểm dấu nằm trong vòng tròn có đường kính 2 mm.", "Khi 3 điểm dấu nằm trong vòng tròn có đường kính 5 mm.", "Khi 3 điểm dấu nằm trong vòng tròn có đường kính 10 mm.", "Khi 3 điểm dấu nằm trùng khít lên nhau tại một điểm."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 55 - 56", "topic": "CHUYÊN ĐỀ 5: NGẮM CHỤM, NGẮM TRÚNG & BÀI BẮN BIA 4", "placeholder": false}, {"id": 44, "set": 5, "number": 44, "level": "Thông hiểu", "text": "Cách xác định Điểm Chạm Trung Bình (ĐCTB) của 3 điểm chạm trong kiểm tra độ trúng được thực hiện theo quy tắc hình học nào?", "options": ["Nối 2 điểm gần nhất chia đôi -> Nối điểm giữa đó với điểm thứ ba -> Chia đoạn này thành 3 phần bằng nhau, điểm 1/3 gần điểm giữa 2 điểm trước là ĐCTB.", "Lấy trung điểm của đoạn thẳng nối 2 điểm xa nhau nhất.", "Vẽ đường tròn đi qua 3 điểm, tâm đường tròn là ĐCTB.", "Lấy điểm nằm ở vị trí cao nhất làm ĐCTB."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 57", "topic": "CHUYÊN ĐỀ 5: NGẮM CHỤM, NGẮM TRÚNG & BÀI BẮN BIA 4", "placeholder": false}, {"id": 45, "set": 5, "number": 45, "level": "Thông hiểu", "text": "Thành tích bắn bài 1 súng AK (3 viên đạn vào bia số 4) được xếp loại KHÁ khi đạt tổng số điểm trong khoảng nào?", "options": ["Từ 20 đến 24 điểm.", "Từ 25 đến 30 điểm.", "Từ 15 đến 19 điểm.", "Dưới 15 điểm."], "answer": 0, "source": "SGK GDQP&AN 12, Bài 6, Trang 58", "topic": "CHUYÊN ĐỀ 5: NGẮM CHỤM, NGẮM TRÚNG & BÀI BẮN BIA 4", "placeholder": false}, {"id": 46, "set": 5, "number": 46, "level": "Thông hiểu", "text": "Khi bắn bia số 4 cự li 100 m, nếu người bắn chọn THƯỚC NGẮM 3 thì điểm ngắm const KEY='gdqp-ak-quang-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn tập chuyên đề AK</h1><p>50 câu hỏi · 5 chuyên đề. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện toàn bộ 50 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>50</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Tài liệu không có giải thích riêng. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel row"><div><h3>Thi thử toàn bộ 50 câu</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40">40 phút</option><option value="50" selected>50 phút</option><option value="60">60 phút</option></select></div><button class="primary" data-start="exam">Bắt đầu thi thử →</button></div><h2 style="margin-top:25px">Luyện theo chuyên đề</h2><section class="grid">${[1,2,3,4,5].map(n=>`<article class="card"><span class="tag">CHUYÊN ĐỀ ${n} · 10 CÂU</span><h3>${esc(bank.find(q=>q.set===n).topic.replace(/^CHUYÊN ĐỀ \d+:\s*/,''))}</h3><button data-topic="${n}">Luyện chuyên đề →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?'THI THỬ · CHUYÊN ĐỀ AK':'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note"><b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:a.mode==='exam'?'Thi thử':'Luyện tập',date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
